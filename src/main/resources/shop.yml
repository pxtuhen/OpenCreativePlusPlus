#
# OpenCreative++ — магазин: платные улучшения мира и маркет кода.
#
# Платят валютой сервера (config.yml → economy): своей валютой OpenCreative++ или через Vault.
#

#
# Улучшения, которые игрок покупает за монеты:
#   /upgrades — меню (или «Мои лимиты» → «Улучшения»).
# Этажи и размер покупаются для мира, в котором стоит игрок (только свой мир).
# Слоты миров — для игрока, на все его миры.
# Купленное добавляется к значению группы из groups.yml.
#
shop:
  # Включить магазин улучшений.
  enabled: true

  upgrades:
    # +1 этаж (платформа) кодинга в мире.
    coding-floor:
      price: 500
      # Сколько этажей можно докупить в один мир.
      max: 4

    # +step блоков к стороне мира (128 → 160 при step 32).
    world-size:
      step: 32
      price: 400
      # Сколько раз можно купить для одного мира.
      max: 4

    # +1 мир, который игрок может создать.
    world-slot:
      price: 1500
      max: 3

#
# Маркет кода: игроки продают свои модули кода или отдают бесплатно.
#   /market — меню маркета.
# Покупатель получает лицензию: ставит модуль в любые свои миры, сколько угодно раз.
#
marketplace:
  # Включить маркет.
  enabled: true

  # Доля сервера с каждой продажи (0.1 = 10%). Остальное получает автор.
  commission: 0.1

  # Цены (0 — бесплатно всегда можно).
  min-price: 10
  max-price: 100000

  # Сколько модулей один игрок может держать на маркете.
  max-listings-per-player: 10

#
# OpenCreative++ — датапаки в мирах игроков.
#
# Как это работает:
#   1. Админ кладёт датапак (папку или .zip) в plugins/OpenCreativePP/datapacks/
#      и описывает его ниже в library.
#   2. При запуске сервера плагин копирует датапаки в датапаки сервера и включает их.
#      Minecraft загружает датапаки на весь сервер сразу — по-другому движок не умеет.
#   3. Владелец мира с правом Premium включает нужные датапаки:
#      /datapack — меню, /datapack [id] — включить/выключить (сокращение /dp).
#   4. Функции датапака запускаются ТОЛЬКО в мирах, где он включён:
#      - load-function — один раз при запуске режима игры (/play);
#      - tick-function — каждый тик, пока мир в режиме игры;
#      - из кода: действие мира «Запустить функцию датапака» (только включённые в мире датапаки).
#      Функции выполняются в мире игрока (как «execute in <мир> positioned <спавн>»): ~ ~ ~ и @p — внутри мира.
#      ВНИМАНИЕ: @a и @e без distance= выбирают игроков и существ ВСЕХ миров сервера.
#      Пиши @a[distance=0..] / @e[distance=0..] — тогда только этот мир. Плагин предупредит в консоли.
#
# Важно: рецепты, лут-таблицы, теги и измерения датапака Minecraft применяет на весь сервер.
# Поэтому подключай только проверенные датапаки. Игроки загружать свои датапаки не могут:
# функции выполняются с правами уровня 2 и могут затронуть весь сервер.
#
# Право (Premium):
#   opencreativepp.datapack — включать датапаки в своём мире.
#   Входит в opencreativepp.premium (группа premium из groups.yml) и в opencreativepp.admin.
#
# Проверки при запуске и /datapack reload — датапак не подключится, если:
#   - нет файла/папки из file или это не датапак (нет pack.mcmeta или папки data/);
#   - pack.mcmeta битый или в нём нет pack.pack_format;
#   - в датапаке нет функции, указанной в load-function / tick-function;
#   - ID содержит что-то кроме латиницы, цифр и _.
# Каждая причина пишется в консоль одной строкой.
#
# Команды:
#   /datapack list         — список датапаков и результаты проверок (opencreative.datapacks.list)
#   /datapack reload       — перечитать datapacks.yml и папку        (opencreative.datapacks.reload)
#   /datapack              — меню датапаков текущего мира (владелец мира, Premium)
#   /datapack [id]         — включить/выключить датапак в текущем мире
#
datapacks:
  # Включить систему датапаков.
  enabled: true

  # Право на включение датапаков в своём мире (Premium).
  permission: "opencreativepp.datapack"

  # Сколько датапаков можно включить в одном мире одновременно.
  max-per-world: 5

  # Сколько ошибок tick-function подряд терпеть, прежде чем выключить датапак в мире
  # (защита от сломанных функций). 0 — не выключать.
  max-tick-errors: 20

  # Библиотека разрешённых датапаков.
  # Ключ — ID датапака (латиница, цифры, _), им пользуются команды.
  library: {}
    #parkour:
    #  # Папка или архив в plugins/OpenCreativePP/datapacks/
    #  file: "parkour_tools"
    #  # Название и описание в меню (коды цветов &a, &#RRGGBB работают)
    #  name: "&aПаркур-инструменты"
    #  description:
    #    - "&7Чекпоинты и таймер"
    #  icon: "FEATHER"
    #  # Функции (namespace:path). Пустая строка — не запускать.
    #  load-function: "parkour:load"
    #  tick-function: "parkour:tick"
    #  # Дополнительное право только для этого датапака. Пусто — хватает opencreativepp.datapack.
    #  permission: ""

/**
 * OpenCreative+ Gradle Dependencies.
 * McChicken Studio 2017-2026
 */
plugins {
    id "java"
    id "com.gradleup.shadow" version "9.6.1"
    id "io.papermc.paperweight.userdev" version "2.0.0-beta.24" // If you don't want to use paperweight, remove this line.
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

group = "opencreativepp"
description = "OpenCreative++ - fork of OpenCreative+ by McChicken Studio for Paper 1.21.11"
version = findProperty("cpVersion") ?: "1.0.0"

repositories {
    maven { url "https://repo.papermc.io/repository/maven-public/" }
    maven { url "https://oss.sonatype.org/content/groups/public/" }
    maven { url "https://repo.extendedclip.com/content/repositories/placeholderapi/" }
    maven { url "https://libraries.minecraft.net/" }
    maven { url "https://repo.dmulloy2.net/repository/public/" }
    maven { url "https://jitpack.io" }
    maven { url "https://repo.md-5.net/content/groups/public/" }
    maven { url "https://maven.enginehub.org/repo/" }
    maven { url "https://mvn.lib.co.nz/public" }
    maven { url "https://repo.codemc.io/repository/creatorfromhell/" }
    maven { url "https://repo.codemc.io/repository/maven-releases/" }
    maven { url "https://repo.codemc.io/repository/maven-snapshots/" }
    maven { url "https://repo.essentialsx.net/releases/" }
    maven { url = 'https://repo.infernalsuite.com/repository/maven-snapshots/' }
    maven {
        name = "gitlab-maven"
        url = "https://gitlab.com/api/v4/projects/58168569/packages/maven"
    }
    mavenCentral()
}

dependencies {
    // Paper 1.21.11
    paperweight.paperDevBundle("1.21.11-R0.1-SNAPSHOT")

    // bStats - tracks how many servers use this plugin
    implementation "org.bstats:bstats-bukkit:3.0.2"

    // File operations
    implementation "commons-io:commons-io:2.16.1"

    // Addon: EssentialsX - ignore players in chat.
    compileOnly 'net.essentialsx:EssentialsX:2.21.0'

    // Addon: FastAsyncWorldEdit - faster coding platforms creation
    compileOnly "com.fastasyncworldedit:FastAsyncWorldEdit-Core:2.11.0"
    compileOnly("com.fastasyncworldedit:FastAsyncWorldEdit-Bukkit:2.11.0") {
        exclude group: "*", module: "FastAsyncWorldEdit-Core"
    }

    // Addon: PlaceholderAPI support
    compileOnly "me.clip:placeholderapi:2.11.5"

    // Addon: ProtocolLib - custom effects/animations with packets
    compileOnly "net.dmulloy2:ProtocolLib:5.4.0"

    // Addon: PacketEvents - custom effects/animations with packets
    compileOnly "com.github.retrooper:packetevents-spigot:2.12.1"

    // Addon: Vault - economy operations
    compileOnly "com.github.MilkBowl:VaultAPI:1.7.1"

    // Addon: LibsDisguises - mob disguises
    compileOnly "me.libraryaddict.disguises:libsdisguises:11.0.18"

    // Addon: AdvancedSlimePaper - async world loading and unloading
    compileOnly 'com.infernalsuite.asp:api:4.0.0-SNAPSHOT'
}

// Addons bring old spigot-api and lz4 transitively; Paper 1.21.11 already provides both.
configurations.configureEach {
    exclude group: "org.spigotmc", module: "spigot-api"
    exclude group: "org.lz4", module: "lz4-java"
}

compileJava.options.encoding = "UTF-8"
javadoc.options.encoding = "UTF-8"

shadowJar {
    // bStats relocation (required by bStats)
    relocate "org.bstats.bukkit", "ua.mcchickenstudio.opencreative.utils.hooks"
    minimize()
    archiveBaseName.set("OpenCreativePP")
    archiveClassifier.set("")
}

// On Windows "creativeplus-1.0.0.jar" and "OpenCreativePP-1.0.0.jar" are the same file, so the thin jar gets a suffix.
jar {
    archiveClassifier.set("plain")
}

build.dependsOn shadowJar
processResources {
    filteringCharset = "UTF-8"

    filesMatching("plugin.yml") {
        expand (build_timestamp: new Date().format("dd-MM-yyyy"), version: project.version)
    }
}

